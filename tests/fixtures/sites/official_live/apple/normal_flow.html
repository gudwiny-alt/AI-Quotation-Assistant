<!doctype html>
<!-- Sanitized semantic fixture for the Apple China purchase workflow. -->
<html lang="zh-CN"><body>
  <section data-screen="store">
    <section data-apple-role="result-region">
      <article data-apple-role="product-card">
        <a class="thumb" href="/shop/buy-iphone/iphone-17/mg734ch/a">
          <h2 data-apple-role="product-title">iPhone 17</h2>
        </a>
      </article>
      <article data-apple-role="product-card">
        <a class="thumb" href="/shop/buy-iphone/iphone-17-pro/mg900ch/a">
          <h2 data-apple-role="product-title">iPhone 17 Pro</h2>
        </a>
      </article>
    </section>
  </section>
  <section data-screen="product" hidden>
    <main data-apple-role="buy-iphone" data-model="iPhone 17">
      <section data-apple-role="purchase-summary">
        <h1 data-apple-role="detail-title" style="left:40px;top:80px;width:620px;height:46px">购买 iPhone 17</h1>
        <div data-apple-role="current-device-price" style="left:40px;top:150px;width:220px;height:42px">RMB 9,999</div>
        <span data-apple-role="monthly-price">每月 RMB 417（24 期）</span>
        <span data-apple-role="trade-in-price">换购折抵 RMB 900</span>
        <span data-apple-role="service-price">AppleCare+ RMB 1,799</span>
        <section data-apple-role="storage-group" style="left:40px;top:240px;width:620px;height:88px">
          <h2>存储容量</h2>
          <button data-option-kind="apple-storage">256GB</button>
          <button data-option-kind="apple-storage" aria-selected="true">512GB</button>
        </section>
        <section data-apple-role="color-group" style="left:40px;top:350px;width:620px;height:88px">
          <h2>外观</h2>
          <button data-option-kind="apple-color">黑色</button>
          <button data-option-kind="apple-color" aria-selected="true">白色</button>
        </section>
      </section>
    </main>
  </section>
</body></html>
