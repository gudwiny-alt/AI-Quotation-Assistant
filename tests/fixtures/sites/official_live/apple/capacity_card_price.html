<!doctype html>
<!--
  Sanitized Apple China configurator layout observed on 2026-08-19.
  Apple places the full one-time price inside the selected storage card;
  the same card can also include an optional monthly-installment message.
-->
<html lang="zh-CN"><body>
  <section data-screen="store">
    <section data-apple-role="result-region">
      <article><a class="thumb" href="/shop/buy-iphone/iphone-17/mg734ch/a">
        <h2 data-apple-role="product-title">iPhone 17</h2>
      </a></article>
    </section>
  </section>
  <section data-screen="product" hidden>
    <main data-apple-role="buy-iphone" data-model="iPhone 17">
      <header data-autom="product-name" style="left:24px;top:18px;width:240px;height:40px">iPhone 17</header>
      <section data-autom="dimensionColor" style="left:760px;top:220px;width:480px;height:110px">
        <h2>颜色 - 黑色</h2>
        <button data-option-kind="apple-color" aria-label="黑色" aria-pressed="true" style="left:770px;top:270px;width:120px;height:42px"></button>
        <button data-option-kind="apple-color" aria-label="白色" style="left:900px;top:270px;width:120px;height:42px"></button>
      </section>
      <section data-autom="dimensionCapacity" style="left:760px;top:410px;width:500px;height:220px">
        <h2>存储容量：你需要多大的存储空间？</h2>
        <button data-option-kind="apple-storage" aria-pressed="true" style="left:770px;top:470px;width:440px;height:112px">256GB¹ RMB 5,999 或 RMB 250/月（24 期）起</button>
        <button data-option-kind="apple-storage" style="left:770px;top:590px;width:440px;height:112px">512GB RMB 7,999 或 RMB 334/月（24 期）起</button>
      </section>
    </main>
  </section>
</body></html>
