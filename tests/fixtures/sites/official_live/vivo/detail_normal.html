<!doctype html>
<html lang="zh-CN">
  <head><title>vivo X200 - vivo 官方商城</title></head>
  <body>
    <main data-screen="product">
      <section data-vivo-role="product-summary" class="product-summary">
        <h1 data-vivo-role="detail-title" style="left:30px;top:110px;width:410px;height:42px">vivo X200</h1>
        <section data-vivo-role="purchase-summary" class="buy-summary">
          <div data-vivo-role="capacity-group" class="sku-group capacity-group"
            style="left:30px;top:270px;width:600px;height:76px">
            <span>版本</span>
            <button data-vivo-role="capacity-option" data-option-kind="capacity" aria-selected="false">12GB+256GB</button>
            <button data-vivo-role="capacity-option" data-option-kind="capacity" aria-selected="false">16GB+512GB</button>
          </div>
          <div data-vivo-role="color-group" class="sku-group color-group"
            style="left:30px;top:362px;width:600px;height:76px">
            <span>颜色</span>
            <button data-vivo-role="color-option" data-option-kind="color" aria-selected="false">辰夜黑</button>
            <button data-vivo-role="color-option" data-option-kind="color" aria-selected="false">宝石蓝</button>
          </div>
          <div data-vivo-role="main-price-region" class="price-panel"
            data-official-price-context="当前售价" style="left:30px;top:174px;width:530px;height:76px">
            <span>到手价</span>
            <span data-vivo-role="current-price" class="current-price">¥4,699</span>
            <span data-vivo-role="current-price" class="current-price">¥4,499</span>
            <span data-vivo-role="coupon-amount" class="coupon-price">领券立减 ¥300</span>
            <span data-vivo-role="installment" class="installment-price">¥187.46 × 24 期</span>
            <del><span data-vivo-role="list-price" class="list-price">¥4,999</span></del>
          </div>
        </section>
      </section>
      <aside data-vivo-role="accessory-recommendation">vivo 耳机 ¥299</aside>
      <div data-vivo-role="floating-promo" hidden>限时活动</div>
    </main>
  </body>
</html>
