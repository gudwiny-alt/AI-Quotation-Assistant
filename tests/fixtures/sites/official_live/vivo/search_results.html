<!doctype html>
<html lang="zh-CN">
  <head><title>vivo 官方商城</title></head>
  <body>
    <main data-screen="store">
      <header data-vivo-role="store-header">
        <a class="vivo-logo" href="https://shop.vivo.com.cn/">vivo 官方商城</a>
        <button data-vivo-role="search-opener" data-action="open-search">搜索</button>
      </header>
    </main>

    <main data-screen="search" hidden>
      <section data-vivo-role="search-panel" class="search-panel">
        <input data-vivo-role="search-input" placeholder="请输入搜索内容" value="">
      </section>
    </main>

    <main data-screen="results" hidden>
      <section data-vivo-role="search-panel" class="search-panel">
        <input data-vivo-role="search-input" value="vivo X200"
          style="left:24px;top:20px;width:320px;height:40px">
      </section>
      <section data-vivo-role="result-region" class="product-result-list"
        style="left:24px;top:88px;width:1120px;height:620px">
        <article data-vivo-role="result-card" class="product-card">
          <a data-vivo-role="product-link" href="/product/1000199">
            <span data-vivo-role="product-title">vivo X200 Pro 12GB+256GB 辰夜黑</span>
          </a>
        </article>
        <article data-vivo-role="result-card" class="product-card">
          <a data-vivo-role="product-link" href="/product/x200-topic">
            <span data-vivo-role="product-title">vivo X200 12GB+256GB 钛色</span>
          </a>
        </article>
        <article data-vivo-role="result-card" class="product-card sold-out-card">
          <a data-vivo-role="product-link" href="/product/1000200?skuId=100020011">
            <span data-vivo-role="product-title">vivo X200 16GB+512GB 宝石蓝</span>
            <span data-vivo-role="stock-note">暂时缺货</span>
          </a>
        </article>
        <article data-vivo-role="result-card" class="product-card">
          <a data-vivo-role="product-link" href="/product/1000201?spuId=1000201">
            <span data-vivo-role="product-title">vivo X200 12GB+256GB 辰夜黑</span>
          </a>
        </article>
        <article data-vivo-role="result-card" class="product-card">
          <a data-vivo-role="product-link" href="/product/1000202">
            <span data-vivo-role="product-title">vivo X200S 12GB+256GB 辰夜黑</span>
          </a>
        </article>
      </section>
    </main>
  </body>
</html>
