[project]
name = "fujian-mobile-quotation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mss>=10,<11",
  "openpyxl>=3.1.5,<4",
  "Pillow>=11,<13",
  "playwright>=1.50,<2",
]

[project.scripts]
quote-app = "quote_app.app:main"

[project.optional-dependencies]
macos-capture = [
  "pyobjc-framework-Quartz>=10.3,<12",
  "pyobjc-framework-Cocoa>=10.3,<12",
  "pyobjc-framework-ApplicationServices>=10.3,<12",
]
dev = [
  "msoffcrypto-tool>=5.4,<6",
  "pytest>=8.4,<9",
  "pyinstaller>=6.14,<7",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
