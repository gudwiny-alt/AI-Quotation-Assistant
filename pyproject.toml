[project]
name = "fujian-mobile-quotation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
